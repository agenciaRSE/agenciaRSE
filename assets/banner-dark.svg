<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Diego Meijide · AGENCIA RSE</title>
  <desc id="d">Diseño web y mantenimiento WordPress, WooCommerce e IA en WordPress. Estudio de A Coruña, desde 2018.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, Menlo, monospace; }
    .l { opacity: 0; animation: show 12s infinite; }
    .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.8s; } .l4 { animation-delay: 2.7s; }
    .l5 { animation-delay: 3.6s; } .l6 { animation-delay: 4.5s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cursor { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0a0a0a"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#brand)"/>
  </g>

  <!-- Identidad -->
  <text x="64" y="92" class="mono" font-size="15" fill="#a5b4fc" letter-spacing="2">AGENCIA RSE · A CORUÑA · DESDE 2018</text>
  <text x="64" y="160" class="sans" font-size="60" font-weight="700" fill="#ffffff">Diego <tspan fill="url(#brand)">Meijide</tspan></text>
  <text x="64" y="204" class="sans" font-size="22" fill="#cbd5e1">Fundador y desarrollador WordPress</text>
  <text x="64" y="250" class="sans" font-size="17" fill="#94a3b8">Mantenimiento y seguridad · Diseño web · WooCommerce · IA en WordPress</text>

  <!-- Terminal -->
  <g transform="translate(728 58)">
    <rect width="408" height="204" rx="12" fill="#111827" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="22" cy="20" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="58" cy="20" r="5" fill="#22c55e" fill-opacity="0.8"/>
    <text x="204" y="24" text-anchor="middle" class="mono" font-size="12" fill="#6b7280">~/tu-web</text>
    <g class="mono" font-size="14">
      <text x="20" y="62" class="l l1"><tspan fill="#a855f7">$</tspan><tspan fill="#e5e7eb"> wp db export copia.sql</tspan></text>
      <text x="20" y="86" class="l l2" fill="#4ade80">✓ copia antes de tocar</text>
      <text x="20" y="116" class="l l3"><tspan fill="#a855f7">$</tspan><tspan fill="#e5e7eb"> wp plugin update --all</tspan></text>
      <text x="20" y="140" class="l l4" fill="#4ade80">✓ plugins al día</text>
      <text x="20" y="170" class="l l5"><tspan fill="#a855f7">$</tspan><tspan fill="#e5e7eb"> wp cache flush</tspan></text>
      <text x="20" y="194" class="l l6" fill="#4ade80">✓ web revisada <tspan class="cursor" fill="#e5e7eb">▋</tspan></text>
    </g>
  </g>
</svg>
